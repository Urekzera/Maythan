<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Our Map · Nathan & May</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" />
  <link rel="stylesheet" href="style.css?v=2" />
</head>
<body>

  <!-- Back to the home page -->
  <a id="home-btn" href="index.html">← Home</a>

  <!-- The globe gets drawn into this div -->
  <div id="globe"></div>

  <!-- Side panel: hidden until you click a pin -->
  <aside id="panel" class="hidden">
    <button id="close-btn" aria-label="Close">&times;</button>
    <button id="back-btn"></button>
    <h2 id="place-name"></h2>
    <p id="place-status"></p>
    <p id="place-dates"></p>
    <p id="place-notes"></p>

    <div id="place-photos"></div>

    <h3 id="spots-title">Places we went</h3>
    <ul id="place-spots"></ul>

    <h3 id="itinerary-title">Itinerary</h3>
    <ul id="place-itinerary"></ul>
  </aside>

  <!-- Libraries (loaded from the internet) -->
  <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>

  <!-- Our own code. Order matters: data first, then the script that uses it.
       After you change places.js / script.js / style.css, bump the ?v= number
       (e.g. ?v=2 → ?v=3) so phones download the new version instead of an old saved copy. -->
  <script src="places.js?v=3"></script>
  <script src="script.js?v=3"></script>
</body>
</html>
