<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nathan & May</title>
  <!-- Fonts: a fancy one for titles, a clean one for text -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,500&family=Nunito:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="home.css?v=3" />
</head>
<body>

  <main>
    <header>
      <!-- Our photo (to change it, replace photos/us.jpg and bump ?v= so phones load the new one) -->
      <img id="cover" src="photos/us.jpg?v=2" alt="Nathan & May" />

      <h1>Nathan <span class="amp">&amp;</span> May</h1>
      <p class="tagline">Our little corner of the world</p>
    </header>

    <!-- Our numbers: filled in by home.js -->
    <section class="stats">
      <div class="stat">
        <span class="num" id="days">–</span>
        <span class="stat-label">days together</span>
      </div>
      <div class="stat">
        <span class="num" id="countries">–</span>
        <span class="stat-label">countries</span>
      </div>
      <div class="stat">
        <span class="num" id="cities">–</span>
        <span class="stat-label">cities</span>
      </div>
    </section>
    <p class="since">since July 31, 2023 ♥</p>

    <!-- Menu: one card per page. To add a page, copy one <a> and change it. -->
    <nav class="menu">
      <a class="card" href="map.html">
        <span class="icon">🗺️</span>
        <span class="text">
          <span class="label">Our Map</span>
          <span class="desc">Every place we've been together</span>
        </span>
        <span class="arrow">→</span>
      </a>
      <a class="card" href="cats.html">
        <span class="icon">🐱</span>
        <span class="text">
          <span class="label">Our Cats</span>
          <span class="desc">The furry members of the family</span>
        </span>
        <span class="arrow">→</span>
      </a>
    </nav>

    <footer>made with ♥</footer>
  </main>

  <!-- places.js is shared with the map, so the numbers update when we add places -->
  <script src="places.js?v=2"></script>
  <script src="home.js?v=2"></script>
</body>
</html>
